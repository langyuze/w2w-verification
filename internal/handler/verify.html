<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Request</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 32px 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { font-size: 1.2rem; margin: 0 0 20px; color: #1a1a1a; }
    #status { font-size: 0.95rem; color: #555; line-height: 1.5; }
    #status.error { color: #c0392b; }
    #status.success { color: #27ae60; }
    #requester-info {
      display: none;
      margin: 20px 0;
      text-align: left;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
    }
    .requester-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .requester-portrait {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e0e0e0;
      flex-shrink: 0;
    }
    .requester-portrait-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #999;
      flex-shrink: 0;
    }
    .requester-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a1a1a;
    }
    .requester-details {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.6;
    }
    .requester-details dt {
      font-weight: 600;
      color: #444;
      display: inline;
    }
    .requester-details dd {
      display: inline;
      margin: 0;
    }
    .requester-details dd::after {
      content: '';
      display: block;
    }
    .requester-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      margin-bottom: 8px;
    }
    #verify-btn {
      display: none;
      margin: 20px auto 0;
      padding: 12px 32px;
      font-size: 1rem;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #verify-btn:hover { background: #1557b0; }
    #verify-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Verification Request</h1>
    <p id="status">Preparing verification&hellip;</p>
    <div id="requester-info">
      <div class="requester-label">Requested by</div>
      <div class="requester-header">
        <div id="portrait-container"></div>
        <div class="requester-name" id="requester-name"></div>
      </div>
      <dl class="requester-details">
        <dt>Document: </dt><dd id="requester-document"></dd>
        <dt>Issuer: </dt><dd id="requester-issuer"></dd>
      </dl>
    </div>
    <button id="verify-btn">Verify</button>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const verifyBtn = document.getElementById('verify-btn');
    const requesterInfo = document.getElementById('requester-info');

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type || '';
    }

    function base64UrlDecode(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return Uint8Array.from(atob(str), c => c.charCodeAt(0));
    }

    function base64ToStandard(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return str;
    }

    function detectImageType(bytes) {
      if (bytes[0] === 0xFF && bytes[1] === 0xD8) return 'image/jpeg';
      if (bytes[0] === 0x89 && bytes[1] === 0x50) return 'image/png';
      if (bytes[0] === 0x47 && bytes[1] === 0x49) return 'image/gif';
      if (bytes[0] === 0x52 && bytes[1] === 0x49) return 'image/webp';
      return 'image/png';
    }

    function showRequester(requester) {
      if (!requester) return;

      if (requester.legal_name) {
        document.getElementById('requester-name').textContent = requester.legal_name;
      }
      if (requester.document) {
        document.getElementById('requester-document').textContent = requester.document;
      }
      if (requester.issuer) {
        document.getElementById('requester-issuer').textContent = requester.issuer;
      }

      const container = document.getElementById('portrait-container');
      if (requester.portrait) {
        const bytes = base64UrlDecode(requester.portrait);
        const mime = detectImageType(bytes);
        const b64 = base64ToStandard(requester.portrait);
        const img = document.createElement('img');
        img.src = `data:${mime};base64,${b64}`;
        img.alt = requester.legal_name || 'Requester';
        img.className = 'requester-portrait';
        container.appendChild(img);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'requester-portrait-placeholder';
        placeholder.textContent = (requester.legal_name || '?')[0];
        container.appendChild(placeholder);
      }

      requesterInfo.style.display = 'block';
    }

    let credentialOptions = null;
    const requestId = new URLSearchParams(window.location.search).get('requestId');

    (async () => {
      try {
        const keyB64 = window.location.hash.slice(1);

        if (!requestId) {
          setStatus('Missing requestId parameter.', 'error');
          return;
        }
        if (!keyB64) {
          setStatus('Missing encryption key in URL.', 'error');
          return;
        }

        const keyBytes = base64UrlDecode(keyB64);
        console.log('Key length:', keyBytes.length, 'bytes');
        const cryptoKey = await crypto.subtle.importKey(
          'raw', keyBytes, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        console.log('Key imported OK');

        setStatus('Fetching verification data…');
        const res = await fetch(
          `/getVerificationRequest?requestId=${encodeURIComponent(requestId)}`,
          { headers: { Accept: 'application/octet-stream' } }
        );
        if (!res.ok) {
          setStatus(`Failed to fetch payload (${res.status}).`, 'error');
          return;
        }

        const rawText = await res.text();
        console.log('Payload from server (base64url):', rawText);
        const encrypted = base64UrlDecode(rawText.trim());
        console.log('Decoded ciphertext length:', encrypted.length, 'bytes');

        if (encrypted.length < 29) {
          setStatus('Payload too short to contain IV + ciphertext + auth tag.', 'error');
          return;
        }
        const iv = encrypted.slice(0, 12);
        const ciphertext = encrypted.slice(12);
        console.log('IV (hex):', Array.from(iv).map(b => b.toString(16).padStart(2,'0')).join(''));
        console.log('Ciphertext (hex):', Array.from(ciphertext).map(b => b.toString(16).padStart(2,'0')).join(''));
        console.log('Ciphertext length:', ciphertext.length, 'bytes');

        setStatus('Decrypting…');
        const plaintext = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv }, cryptoKey, ciphertext
        );
        const decryptedText = new TextDecoder().decode(plaintext);
        console.log('Decrypted payload:', decryptedText);

        const parsed = JSON.parse(decryptedText);

        if (parsed.dcRequest) {
          credentialOptions = { mediation: 'required', digital: parsed.dcRequest };
        } else {
          setStatus('Invalid payload: missing "dcRequest" field.', 'error');
          console.error('Parsed payload has no "dcRequest" key:', parsed);
          return;
        }
        console.log('Options ready:', JSON.stringify(credentialOptions, null, 2));

        showRequester(parsed.requester);

        setStatus('Ready. Click the button to present your credential.');
        verifyBtn.style.display = 'inline-block';
      } catch (err) {
        console.error('Verification error:', err);
        const detail = err.message || err.name || String(err) || '(no details)';
        setStatus(`Error: ${detail}`, 'error');
      }
    })();

    verifyBtn.addEventListener('click', async () => {
      try {
        verifyBtn.disabled = true;
        setStatus('Waiting for credential…');
        console.log('Calling navigator.credentials.get() with:', credentialOptions);
        const credential = await navigator.credentials.get(credentialOptions);
        console.log('Credential received:', credential);

        setStatus('Saving response…');
        const responsePayload = JSON.stringify({
          data: credential.data,
          protocol: credential.protocol,
          id: credential.id,
          type: credential.type,
        });
        console.log('Response payload:', responsePayload);
        const saveRes = await fetch(
          `/setVerificationResponse?requestId=${encodeURIComponent(requestId)}`,
          { method: 'POST', body: responsePayload }
        );
        if (!saveRes.ok) {
          setStatus(`Failed to save response (${saveRes.status}).`, 'error');
          return;
        }

        setStatus('Verification complete.', 'success');
      } catch (err) {
        console.error('Credential error:', err);
        const detail = err.message || err.name || String(err) || '(no details)';
        setStatus(`Error: ${detail}`, 'error');
        verifyBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
